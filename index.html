<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Licences, branding, online ordering, marketing and content services for people who want to earn from cooking. India, the United States and other countries.">
<meta property="og:title" content="Kitchen Launch">
<meta property="og:description" content="Get paid for the food you already cook. Every step to start a food business, with its cost.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23E6A80C'/%3E%3Cpath d='M10 6h12v4H10zM8 10h16v6H8zM8 16h16v6H8zM10 22h12v4H10z' fill='none' stroke='%23241A00' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>html{-webkit-text-size-adjust:100%}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Kitchen Launch</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Figtree:wght@400;500;600;700&family=Tiro+Devanagari+Hindi&display=swap">
<style>
/* Layout: one sticky bar with a country switch and five views; the roadmap is drawn as a stacked steel food carrier, one tier per stage. */
:root{
  --bg:#EDF1EE; --surface:#FBFCFB; --steel:#DEE5E0; --line:#C3CEC7;
  --ink:#12241C; --muted:#52645B;
  --accent:#E6A80C; --accent-ink:#241A00;
  --leaf:#1C6A48; --leaf-ink:#FFFFFF; --leaf-soft:#DCEDE3;
  --chilli:#B4381F; --chilli-soft:#F6E1DB;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --hindi:"Tiro Devanagari Hindi","Noto Sans Devanagari",serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1310; --surface:#141D19; --steel:#1D2924; --line:#30413A;
    --ink:#E7EEEA; --muted:#9AAAA1;
    --accent:#F1B52B; --accent-ink:#241A00;
    --leaf:#62C99A; --leaf-ink:#06231A; --leaf-soft:#173328;
    --chilli:#F08670; --chilli-soft:#3A1D16;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1310; --surface:#141D19; --steel:#1D2924; --line:#30413A;
  --ink:#E7EEEA; --muted:#9AAAA1;
  --accent:#F1B52B; --accent-ink:#241A00;
  --leaf:#62C99A; --leaf-ink:#06231A; --leaf-soft:#173328;
  --chilli:#F08670; --chilli-soft:#3A1D16;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
h1,h2,h3{font-family:var(--display);line-height:1.08;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--leaf);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:1120px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:8px;text-decoration:none;color:var(--ink)}
.brand b{font-family:var(--display);font-size:21px;font-weight:800;letter-spacing:-.02em}
.brand span{font-family:var(--hindi);color:var(--leaf);font-size:17px}
.country{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:13.5px;font-weight:600}
.country svg{width:15px;height:15px;flex:none}
.country select{border:0;background:transparent;color:var(--muted);font-weight:600;font-size:13.5px;padding:4px 2px;cursor:pointer;max-width:150px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
.tabs{display:flex;gap:4px;overflow-x:auto;margin-left:auto;min-width:0;max-width:100%}
@media (max-width:760px){.country{margin-left:auto}.tabs{order:3;flex-basis:100%;margin-left:0}}
.tabs a{white-space:nowrap;text-decoration:none;color:var(--muted);font-weight:600;font-size:14.5px;padding:8px 12px;border-radius:999px}
.tabs a[aria-current="page"]{background:var(--ink);color:var(--bg)}
.tabs a .count{display:inline-block;min-width:20px;text-align:center;margin-left:6px;padding:0 6px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-size:12.5px}

main{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:28px 64px}
.view{display:grid;gap:32px}
.lede{color:var(--muted);max-width:62ch}
.eyebrow{font-size:12.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--leaf)}
.sec-head{display:grid;gap:8px}
.sec-head h2{font-size:clamp(26px,4vw,36px);font-weight:700}

.hero{display:grid;gap:14px}
.hero h1{font-size:clamp(36px,7.4vw,74px);font-weight:800;letter-spacing:-.035em;max-width:14ch}
.hero h1 em{font-style:normal;background:var(--accent);color:var(--accent-ink);padding:0 .14em;border-radius:.12em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.hero .lede{font-size:18px}

.paths{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:10px}
.path{display:grid;gap:6px;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer}
.path svg{width:30px;height:30px;color:var(--leaf)}
.path b{font-family:var(--display);font-size:17.5px}
.path small{color:var(--muted);font-size:13.5px;line-height:1.35}
.path[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.path[aria-pressed="true"] small{color:var(--steel)}
.path[aria-pressed="true"] svg{color:var(--accent)}

.build{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:820px){.build{grid-template-columns:minmax(0,1fr)}}
.qs{display:grid;gap:20px}
fieldset{border:0;padding:0;margin:0;display:grid;gap:8px;min-width:0}
legend{font-weight:700;padding:0;margin-bottom:8px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;font-size:14.5px}
.opt input{margin-top:3px;accent-color:var(--leaf)}
.opt:has(input:checked){border-color:var(--leaf);background:var(--leaf-soft)}

.carrier{display:grid;gap:3px;min-width:0}
.handle{width:132px;height:24px;margin:0 auto;border:4px solid var(--line);border-bottom:0;border-radius:66px 66px 0 0}
.tier{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:16px;display:grid;gap:12px}
.tier.first{border-radius:20px 20px 4px 4px}
.tier.last{border-radius:4px 4px 20px 20px}
.tier-head{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.tier-head span{font-size:12.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.tier-head h3{font-size:20px;font-weight:700}
.tier-note{color:var(--muted);font-size:14.5px}
.rows{display:grid}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;align-items:center;padding:11px 0;border-top:1px solid var(--steel)}
@media (max-width:520px){.row{grid-template-columns:minmax(0,1fr)}}
.row-main{display:grid;gap:3px;min-width:0}
.row-title{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-weight:600}
.row-why{color:var(--muted);font-size:14px}
.row-side{display:flex;gap:10px;align-items:center}
.price{font-weight:700;white-space:nowrap}
.price small{font-weight:500;color:var(--muted)}
.tag{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:5px}
.tag.must{background:var(--chilli-soft);color:var(--chilli)}
.tag.good{background:var(--steel);color:var(--muted)}
.carrier-foot{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding-top:14px}

.btn{border:1.5px solid var(--ink);background:transparent;border-radius:999px;padding:7px 14px;font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.on{background:var(--leaf);border-color:var(--leaf);color:var(--leaf-ink)}
.btn.big{padding:11px 20px;font-size:15.5px}
.btn.quiet{border-color:var(--line);color:var(--muted)}

.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:14px;font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.search{flex:1 1 200px;min-width:0;padding:8px 13px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:10px;align-content:start;min-width:0}
.card h3{font-size:19px;font-weight:700}
.card p{color:var(--muted);font-size:14.5px}
.card ul{margin:0;padding-left:18px;font-size:14px;display:grid;gap:3px}
.meta{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:13.5px;color:var(--muted)}
.card-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:4px}
.cat-label{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--leaf)}

.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;align-items:start}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.field{display:grid;gap:4px;font-size:13.5px;font-weight:600;min-width:0}
.field input,.field select,.field textarea{padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg);font-weight:500;font-size:15px;width:100%;min-width:0}
.result{background:var(--ink);color:var(--bg);border-radius:12px;padding:16px;display:grid;gap:12px}
.result .bigfig{font-family:var(--display);font-size:clamp(28px,6vw,42px);font-weight:800;line-height:1.05}
.result dl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;margin:0;font-size:14.5px}
.result dt{opacity:.75}
.result dd{margin:0;font-weight:700;text-align:right}
.result .warn{color:var(--accent);font-size:14px}
.doc-list{margin:0;padding-left:18px;font-size:14.5px;display:grid;gap:3px}

.plan{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:820px){.plan{grid-template-columns:minmax(0,1fr)}}
.totals{display:grid;gap:6px;padding-top:12px;border-top:2px solid var(--ink)}
.totals div{display:flex;justify-content:space-between;gap:12px}
.totals .grand{font-family:var(--display);font-size:24px;font-weight:800}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:26px;color:var(--muted);display:grid;gap:12px;justify-items:start}
.note{font-size:13.5px;color:var(--muted)}
.out{width:100%;min-height:220px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:14px;line-height:1.45}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;margin:0;padding:0;list-style:none;counter-reset:step}
.steps li{display:grid;gap:6px;align-content:start;counter-increment:step;border-top:2px solid var(--ink);padding-top:12px}
.steps li::before{content:counter(step);font-family:var(--display);font-weight:800;font-size:30px;line-height:1;color:var(--leaf)}
.steps b{font-family:var(--display);font-size:19px}
.steps span{color:var(--muted);font-size:15px}
.faq{display:grid;max-width:760px}
.faq details{border-top:1px solid var(--line);padding:14px 0}
.faq details:last-child{border-bottom:1px solid var(--line)}
.faq summary{cursor:pointer;font-weight:700;font-size:16.5px}
.faq p{color:var(--muted);margin-top:8px;max-width:65ch}
.send{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
.send a.btn{text-decoration:none;color:var(--accent-ink)}
footer{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:0 40px;color:var(--muted);font-size:13.5px;display:grid;gap:6px}
footer a{color:var(--leaf)}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <a class="brand" href="#start"><b>Kitchen Launch</b><span lang="hi" id="mark">रसोई</span></a>
    <nav class="tabs" id="tabs" aria-label="Sections">
      <a href="#start">Start</a>
      <a href="#services">Services</a>
      <a href="#bundles">Bundles</a>
      <a href="#tools">Tools</a>
      <a href="#plan">My plan<span class="count num" id="count">0</span></a>
    </nav>
    <label class="country"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M1.5 8h13M8 1.5c2.2 2 2.2 11 0 13M8 1.5c-2.2 2-2.2 11 0 13" fill="none" stroke="currentColor" stroke-width="1.3"/></svg><span class="sr">Country</span>
      <select id="country"><option value="in">India</option><option value="us">United States</option><option value="intl">Other countries</option></select></label>
  </div>
</header>

<main>
  <section class="view" id="view-start"></section>
  <section class="view" id="view-services" hidden></section>
  <section class="view" id="view-bundles" hidden></section>
  <section class="view" id="view-tools" hidden></section>
  <section class="view" id="view-plan" hidden></section>
</main>

<footer><p id="foot"></p></footer>

  {id:'brand-kit', cat:'brand', per:'once', name:'Name, Logo & Brand Kit', time:'7 days',

  {id:'photo', cat:'brand', per:'once', name:'Food Photoshoot', time:'1 day shoot, 4 days editing',

   us:{price:499, gets:['20 edited photos','Sizes for DoorDash, Uber Eats, Instagram and web','10 short clips for reels']},
   intl:{gets:['20 edited photos','Sizes for delivery apps, Instagram and web','10 short clips for reels']}},

  {id:'dm', cat:'online', per:'once', time:'2 days', blurb:'Take orders where your customers already are.',
   in:{name:'WhatsApp Ordering Setup', price:1999, gets:['WhatsApp Business profile and catalogue','Quick replies, greeting and away messages','Order form and broadcast lists']},
   us:{name:'Text & Instagram Ordering Setup', price:129, gets:['Order form link for texts and bios','Instagram business profile with order button','Auto-replies and a customer list']},
   intl:{name:'WhatsApp & Instagram Ordering Setup', gets:['WhatsApp Business profile and catalogue','Instagram business profile with order button','Auto-replies and a customer list']}},
  {id:'pay', cat:'online', per:'once', name:'Payments Setup', time:'2–3 days',

function guessCountry(){
  try {
    const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || '', lang = navigator.language || '';
    if (tz === 'Asia/Kolkata' || tz === 'Asia/Calcutta') return 'in';
    if (/-US$/i.test(lang) && (tz.indexOf('America/') === 0 || tz === 'Pacific/Honolulu')) return 'us';
  } catch (e) {}
  return 'intl';
}

const CONTACT = {whatsapp:'', email:''};  /* whatsapp: digits with country code, e.g. 919876543210 */
const CODES = ['in','us','intl'];
state.sales = COUNTRY[state.country].defSales.tiffin;
try {
  const saved = JSON.parse(localStorage.getItem('kitchen-launch') || 'null');
  if (saved && typeof saved === 'object' && COUNTRY[saved.country]) state = Object.assign(state, saved);
} catch (e) {}
function save(){ try { localStorage.setItem('kitchen-launch', JSON.stringify(state)); } catch (e) {} }

const LISTS = {}, MAPS = {};
const offered = (s, c) => c === 'intl' ? ((s.us && s.cat !== 'legal' && !s.local) || (!s.us && !s.in && !!s.intl)) : !!s[c];
CODES.forEach(c => {
  LISTS[c] = S.filter(s => offered(s, c)).map(s => {
    const m = c === 'intl' ? Object.assign({}, s, s.us, s.intl) : Object.assign({}, s, s[c]);
    delete m.in; delete m.us; delete m.intl; delete m.local; return m;
  });
  MAPS[c] = Object.fromEntries(LISTS[c].map(s => [s.id, s]));
  state.carts[c] = (state.carts[c] || []).filter(id => MAPS[c][id]);
});

const cfg = () => COUNTRY[state.country];
const svc = id => MAPS[state.country][id];
const cart = () => state.carts[state.country];

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function buildRoadmap(st){
  const tiers = [
    {name:'Make it legal', items:[]},
    {name:'Build the brand', items:[]},
    {name:'Open your counter', items:[]},
    {name:'Bring customers', items:[]},
    {name:'Run it daily', items:[]}
  ];
  const seen = {};
  const add = (t, id, need, why) => {
    if (!svc(id)) return;
    if (seen[id]) { if (need === 'must') seen[id].need = 'must'; return; }
    seen[id] = {id, need, why}; tiers[t].items.push(seen[id]);
  };
  const INTL = st.country === 'intl', US = st.country !== 'in', p = st.path, sells = st.sales !== 'none', ch = new Set(sells ? st.channels : []);
  const meals = p === 'tiffin' || p === 'cloud' || p === 'catering';

  if (!sells) {
    tiers[0].note = US ? 'You do not need a food permit to post recipes. You will need one the day you start selling food.'
                       : 'You do not need FSSAI to post recipes. You will need it the day you start selling food.';
    add(0,'guide','good','Tells you how to register as self-employed so you can invoice brands.');
  } else if (INTL) {
    add(0,'guide','must','Food licence, business registration and tax rules differ in every country. We find yours and prepare the applications.');
  } else if (US) {
    if (st.sales === 'low') {
      add(0,'cottage','must','Your state decides which home-made foods you may sell, where, and up to what yearly sales.');
      add(0,'handler','good','Many states ask cottage food sellers for a food handler card.');
      if (meals) tiers[0].note = 'Most states do not allow meals or perishable food from a home kitchen. A few permit it under home-kitchen (MEHKO) laws. Otherwise choose "Meals" and cook in a licensed kitchen.';
    } else {
      add(0,'health','must','Meals and perishable food must come from a permitted kitchen that passes inspection.');
      add(0,'commissary','must','Renting a licensed shared kitchen is the fastest legal way to start.');
      add(0,'handler','must','Counties require certified food-safety training before they issue a permit.');
    }
  } else {
    if (st.sales === 'low') add(0,'fssai-basic','must','Every kitchen that sells food needs it, even a home kitchen. The number goes on your bills, labels and delivery-app listing.');
    else add(0,'fssai-state','must','Above ₹12 lakh a year the basic registration is no longer enough.');
  }

  if (INTL) {

}

function calc(){
  const c = cfg(), v = id => Math.max(0, parseFloat($(id).value) || 0);
  const V = v('c-ing') + v('c-pack') + v('c-del'), cm = v('c-comm') / 100, m = v('c-margin') / 100;
  const N = v('c-orders'), D = v('c-days'), F = v('c-fixed'), out = $('c-out');
  if (cm + m >= 0.95) { out.innerHTML = '<p class="warn">Commission and profit together are ' + Math.round((cm + m) * 100) + '% of the price, which leaves nothing for food. Lower the profit you want.</p>'; return; }
  const P = Math.ceil((V / (1 - cm - m)) / c.step - 1e-9) * c.step;
  const per = P * (1 - cm) - V, rev = P * N * D, profit = per * N * D - F;
  const be = per > 0 && D > 0 ? Math.ceil(F / (per * D)) : null;
  out.innerHTML = '<div><div class="bigfig num">' + money(P, c.dec) + '</div><div>suggested price per plate</div></div>' +
    '<dl><dt>You keep per plate</dt><dd class="num">' + money(per, c.dec) + '</dd>' +
    '<dt>Monthly sales</dt><dd class="num">' + money(rev) + '</dd>' +
    '<dt>Monthly profit after fixed costs</dt><dd class="num">' + (profit < 0 ? '−' + money(-profit) : money(profit)) + '</dd>' +
    '<dt>Plates a day to break even</dt><dd class="num">' + (be === null ? 'n/a' : be) + '</dd></dl>' +
    (profit < 0 ? '<p class="warn">At this volume you lose money. You need more plates a day or lower fixed costs.</p>' : '');
}

function buildRequest(){
  const c = cfg(), name = $('r-name').value.trim(), phone = $('r-phone').value.trim(), err = $('r-err');
  if (!name || phone.replace(/\D/g,'').length < 10) {
    err.textContent = !name ? 'Enter your name so we know who to call.' : 'Enter a phone number with at least 10 digits.';
    err.hidden = false; $('r-done').hidden = true; return;
  }
  err.hidden = true;
  const t = sums(cart()), path = c.paths.find(p => p.id === state.path).name;
  const lines = ['Kitchen Launch request', '', 'Country: ' + c.label, 'Name: ' + name, 'Phone: ' + phone];
  if ($('r-city').value.trim()) lines.push('City: ' + $('r-city').value.trim());
  lines.push('Starting: ' + path);
  if ($('r-about').value.trim()) lines.push('About: ' + $('r-about').value.trim());
  lines.push('', 'Services:');
  cart().forEach((id, i) => { const s = svc(id); lines.push((i + 1) + '. ' + s.name + ' - ' + money(s.price) + (s.per === 'month' ? ' / month' : '')); });
  lines.push('', 'One-time total: ' + money(t.once));
  if (t.month) lines.push('Monthly total: ' + money(t.month));
  lines.push('Government fees extra.');
  const text = lines.join('\n');
  $('r-out').value = text;
  if (CONTACT.whatsapp) $('r-wa').href = 'https://wa.me/' + CONTACT.whatsapp + '?text=' + encodeURIComponent(text);
  if (CONTACT.email) $('r-mail').href = 'mailto:' + CONTACT.email + '?subject=' + encodeURIComponent('Kitchen Launch request') + '&body=' + encodeURIComponent(text);
  $('r-copied').textContent = '';
  $('r-done').hidden = false;
}

  VIEWS.forEach(n => { $('view-' + n).hidden = n !== v; });
  document.querySelectorAll('#tabs a').forEach(a => { if (a.getAttribute('href') === '#' + v) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); });
  chrome(); RENDER[v]();
  if (scroll) window.scrollTo(0, 0);
}
function refresh(){
  chrome(); save();
  const v = current();
  if (v === 'tools') permit(); else RENDER[v]();
}

window.addEventListener('hashchange', () => show(true));
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.toggle) {
    const id = b.dataset.toggle, list = cart(), i = list.indexOf(id);
    if (i >= 0) list.splice(i, 1); else list.push(id);
    refresh();
  } else if (b.dataset.path) {
    state.path = b.dataset.path;
    state.sales = cfg().defSales[state.path];
    if (state.path === 'cloud' && !state.channels.includes('agg')) state.channels.push('agg');
    refresh();
  } else if (b.id === 'add-musts') {
    buildRoadmap(state).flatMap(t => t.items).filter(i => i.need === 'must').forEach(i => { if (!inCart(i.id)) cart().push(i.id); });
    refresh();
  } else if (b.dataset.bundle) {
    cfg().bundles[+b.dataset.bundle].ids.forEach(id => { if (!inCart(id)) cart().push(id); });
    refresh();
  } else if (b.dataset.cat) {
    state.cat = b.dataset.cat; refresh();
  } else if (b.id === 'r-copy') {
    const out = $('r-out'), done = () => { $('r-copied').textContent = 'Copied'; };
    const fallback = () => { out.focus(); out.select(); $('r-copied').textContent = 'Selected. Press copy on your keyboard.'; };
    try { navigator.clipboard.writeText(out.value).then(done, fallback); } catch (x) { fallback(); }
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'country') {
    if (!COUNTRY[t.value] || t.value === state.country) return;
    state.country = t.value;
    state.sales = cfg().defSales[state.path];
    chrome(); save(); RENDER[current()]();
  }
  else if (t.name === 'sales') { state.sales = t.value; refresh(); }
  else if (t.name === 'team') { state.team = t.value; refresh(); }
  else if (t.name === 'channel') {
    state.channels = Array.from(document.querySelectorAll('input[name="channel"]:checked')).map(i => i.value);
    refresh();
  }
  else if (t.id === 'f-band') permit();
  else if (t.id === 'c-comm') calc();
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'svc-search') {
    state.q = t.value; save();
    const pos = t.selectionStart; renderServices();
    const n = $('svc-search'); n.focus(); try { n.setSelectionRange(pos, pos); } catch (x) {}
  } else if (t.id && t.id.indexOf('c-') === 0) calc();
});
document.addEventListener('submit', e => { if (e.target.id === 'req-form') { e.preventDefault(); buildRequest(); } });

show(false);
</script>

</body>
</html>
